<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Formulário de Prontuário</title>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid justify-content-center">
            <span class="navbar-brand mb-0 h1">Prontuário Eletrônico</span>
        </div>
    </nav>

    <div class="container mt-4">
        <form>
            <div class="card mb-4">
                <div class="card-header bg-info text-white text-center">
                    Dados do Paciente
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">Nome:<input type="text" class="form-control"></div>
                        <div class="col-md-6 mb-3">Idade:<input type="number" class="form-control"></div>
                        <div class="col-md-6 mb-3"></div>
                    </div>
                </div>
            </div>
            <div class="card mb-4">
                <div class="card-header bg-info text-white text-center">      
                Sinais Vitais
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3 mb-3">Pressão Arterial:<input type="text" class="form-control" placeholder="Ex: 120/80"></div>
                        <div class="col-md-3 mb-3">Temperatura:<input type="number" class="form-control" placeholder="Ex: 36.5°C"></div>
                        <div class="col-md-3 mb-3">Frequência Cardíaca:<input type="text" class="form-control"></div>
                        <div class="col-md-3 mb-3">Saturação:<input type="text" class="form-control" placeholder="%"></div>
                    </div>
                </div>
            </div>
            <div class="card mb-4">
                <div class="card-header bg-info text-white text-center">
                    Evolução do Paciente
                </div>
                <div class="card-body">
                   <div class="mb-4">Descreva a Evolução:<textarea type="text" class="form-control" rows="4"></textarea></div> 
                </div>
            </div>
            <div class="card mb-4">
                <div class="card-header bg-info text-white text-center">
                    Medicação
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">Medicamentos:<input type="text" class="form-control"></div>
                        <div class="col-md-3 mb-3">Dosagem:<input type="text" class="form-control"></div>
                        <div class="col-md-3 mb-3">Horário:<input type="time" class="form-control" placeholder="--:--"></div>
                    </div>
                </div>
            </div>
            <div class="text-end mb-5">
                <button class="btn btn-primary" type="subimit">Salvar Prontuário</button>
            </div>
        </form>
    </div>

</body>
</html>
