<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://getbootstrap.com/docs/4.1/content/tables/">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Tabela de Produtos</title>
<body>
    <table class="table table-dark">

        <div class="container">
            <h2 class="text-center mb-4">Tabela de Produtos</h2>
        </div>
        <thead>
        <tr>
             <th scope="col"> </th>
             <th scope="col">Produto</th>
             <th scope="col">Preço</th>
             <th scope="col">Quantidade em Estoque</th>
        </tr>
        </thead>
        <tbody class="table">
        <tr>
             <th scope="row">1</th>
             <td scope="col">Notebook</td>
             <td scope="col">2.199,90</td>
             <td scope="col">15</td>
        </tr>
        <tr>
            <th scope="row">2</td>
            <td scope="col">Mouse</td>
            <td scope="col">58,99</td>
            <td scope="col">10</td>
        </tr>
        <tr>
            <th scope="row">3</th>
            <td scope="col">Teclado</th>
            <td scope="col">79,99</th>
            <td scope="col">7</th>
        </tr>
         <tr>
            <th scope="row">4</th>
            <td scope="col">Monitor</th>
            <td scope="col">399,99</th>
            <td scope="col">3</th>
        </tr>
         <tr>
            <th scope="row">5</th>
            <td scope="col">Headset</th>
            <td scope="col">49,99</th>
            <td scope="col">6</th>
        </tr>

</tbody>
</table>
</body>
</html>
